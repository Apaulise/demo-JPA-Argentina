<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Demo automatización contable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Plan: barra lateral azul fija + área de trabajo clara con tablas densas; el detalle abre en un panel lateral. Tema único claro. */
  --navy:#16396f; --navy-deep:#0f2b57; --teal:#2c7d94; --teal-soft:#e3f0f4; --amber:#d28d32;
  --paper:#f1f3f6; --surface:#ffffff; --ink:#16283f; --muted:#5b6a7f; --line:#dbe1e9;
  --ok:#1a7f55; --ok-soft:#e2f3eb; --warn:#935607; --warn-soft:#fbefd9; --bad:#b0352d; --bad-soft:#fae8e6;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font:700 26px/1.2 var(--display);letter-spacing:-.01em;text-wrap:balance;color:var(--navy-deep)}
h2{font:600 17px/1.3 var(--display);color:var(--navy-deep);text-wrap:balance}
h3{font:600 15px/1.3 var(--display);color:var(--navy-deep)}
a{color:var(--teal)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:208px minmax(0,1fr);height:100%}
.side{background:var(--navy);color:#fff;display:flex;flex-direction:column;gap:22px;padding:20px 14px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .glyph{width:34px;height:34px;border-radius:8px;background:#fff;display:grid;place-items:center;color:var(--navy);flex:none}
.brand .glyph svg{width:20px;height:20px;stroke-width:1.8}
.brand strong{display:block;font:600 15px/1.15 var(--display)}
.brand span{display:block;font-size:12px;color:#b9c9e3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:#d5e0f2;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a[aria-current="page"]{background:#fff;color:var(--navy-deep)}
.nav .count{margin-left:auto;min-width:22px;padding:0 6px;border-radius:11px;background:var(--amber);color:var(--navy-deep);font:600 12px/20px var(--body);text-align:center}
.nav .count:empty{display:none}
.side-foot{margin-top:auto;padding:10px;border:1px solid rgba(255,255,255,.18);border-radius:6px;font-size:12px;line-height:1.45;color:#c6d3ea}
.side-foot strong{color:#fff;font-weight:600}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.cli{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.cli strong{font:600 15px/1.25 var(--display);color:var(--navy-deep)}
.cli span{font-size:12px;color:var(--muted)}
.tag{padding:2px 8px;border-radius:4px;background:var(--warn-soft);color:var(--warn);font:600 11px/18px var(--body);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
#view{flex:1;overflow:auto;padding:24px 24px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.lead{color:var(--muted);font-size:15px;max-width:68ch;margin-top:6px}
.hero{display:flex;gap:16px 24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:6px;border:1px solid transparent;font-weight:600;font-size:14px;line-height:1.2;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.primary{background:var(--teal);color:#fff}
.btn.primary:hover{background:#236a7f}
.btn.cta{background:var(--amber);color:var(--navy-deep);padding:12px 20px;font-size:15px;box-shadow:0 1px 0 rgba(15,43,87,.25)}
.btn.cta:hover{background:#c27f25}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--navy-deep)}
.btn.ghost:hover{border-color:var(--teal);color:var(--teal)}
.btn[disabled]{opacity:.7;cursor:default}
.icon-btn{display:grid;place-items:center;width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--navy-deep);border-color:var(--navy)}
select,input[type="number"],input[type="text"]{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:15px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:11px;font:600 12px/18px var(--body);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--teal-soft);color:var(--teal)}
.pill.neutral{background:#e9edf2;color:var(--muted)}
.pill.run{background:var(--teal-soft);color:var(--teal)}
.pill.run::before{width:9px;height:9px;background:none;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.code{font:500 12px var(--mono);color:var(--teal);background:var(--teal-soft);padding:1px 5px;border-radius:4px;white-space:nowrap}
.sim{font:600 10px/16px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}

/* ---------- tarjetas, mosaicos, proceso ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h small{color:var(--muted);font-size:12px}
.card-b{padding:14px 16px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.tile b{font:700 28px/1.1 var(--display);color:var(--navy-deep);font-variant-numeric:tabular-nums}
.tile b small{font:500 15px var(--body);color:var(--muted)}
.tile span{font-size:13px;color:var(--muted)}
.tile.attn b{color:var(--warn)}
.pipe{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pipe li{position:relative;padding:15px 16px 13px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1px;min-width:0}
.pipe li:first-child{border-left:0}
.pipe li::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:#e6eaf0;transition:background .25s}
.pipe li.done::before{background:var(--teal)}
.pipe li.active::before{background:var(--amber)}
.pipe .n{font:700 24px/1.15 var(--display);color:var(--navy-deep);font-variant-numeric:tabular-nums}
.pipe .n small{font:500 13px var(--body);color:var(--muted)}
.pipe strong{font-weight:600}
.pipe .c{font-size:12px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

/* ---------- bandeja ---------- */
.inbox{list-style:none;margin:0;padding:0}
.in-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:9px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.inbox li:last-child .in-row{border-bottom:0}
.in-row:hover{background:#f6f8fb}
.in-row strong{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.in-row small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;background:#eef1f5;color:var(--navy)}
.ch.whatsapp{background:#e2f3eb;color:var(--ok)}
.ch.arca{background:var(--teal-soft);color:var(--teal)}
.ch.subido{background:var(--warn-soft);color:var(--warn)}
.bar{height:6px;border-radius:3px;background:#e6eaf0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:3px;transition:width .12s linear}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.res-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.res-list li{display:flex;gap:10px;align-items:flex-start}
.res-list svg{margin-top:2px;color:var(--ok)}
.res-list li.w svg{color:var(--warn)}
.note{font-size:12px;color:var(--muted)}

/* ---------- tablas ---------- */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:#f6f8fb;text-align:left;font:600 11px/1.3 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th.num{font-family:var(--body);font-size:11px}
.tbl td small{display:block;color:var(--muted);font-size:12px}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f6f8fb}
.tbl tr.dim td{color:var(--muted)}
.tbl tfoot td{font-weight:600;background:#f6f8fb;border-top:1px solid var(--line);border-bottom:0}
.neg{color:var(--bad)}
.tbl .stick{position:sticky;right:0;background:var(--surface);box-shadow:-10px 0 10px -10px rgba(15,43,87,.22)}
.tbl th.stick{background:#f6f8fb}
.nowrap{white-space:nowrap}
.w-prov{min-width:150px}
.w-cta{min-width:150px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}

/* ---------- excepciones ---------- */
.exc{display:grid;grid-template-columns:4px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.exc::before{content:"";background:var(--amber)}
.exc.bad::before{background:var(--bad)}
.exc.res::before{background:var(--ok)}
.exc-main{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.exc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.exc p{max-width:78ch}
.exc-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.exc-acts label{font-size:13px;color:var(--muted)}
.msg{background:#f6f8fb;border:1px dashed var(--line);border-radius:6px;padding:10px 12px;font-size:13px;white-space:pre-wrap}
.resol{display:flex;gap:8px;align-items:flex-start;color:var(--ok);font-weight:500}

/* ---------- panel de detalle ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,43,87,.38);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1060px,100%);background:var(--paper);z-index:21;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(15,43,87,.18)}
.dw-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.dw-head p{color:var(--muted);font-size:13px}
.dw-head .r{display:flex;gap:10px;align-items:center;flex:none}
.eyebrow{font:600 11px/1.4 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dw-body{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;padding:18px 20px 40px;align-items:start}
.dw-body.one{grid-template-columns:minmax(0,640px);justify-content:center}
.dw-data{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sec h3{font:600 12px/1.3 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.callout{border-radius:var(--r);padding:11px 14px;display:flex;flex-direction:column;gap:6px}
.callout.warn{background:var(--warn-soft);color:#5f3904}
.callout.ok{background:var(--ok-soft);color:#0f5437}
.callout strong{font-weight:600}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start}
.checks .m{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);margin-top:1px}
.checks .m svg{width:12px;height:12px;stroke-width:2.2}
.checks li.fail .m{background:var(--bad-soft);color:var(--bad)}
.checks li.soft .m{background:var(--warn-soft);color:var(--warn)}
.checks small{display:block;color:var(--muted);font-size:12px}
.conf{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.conf .bar{flex:1;max-width:160px}

/* comprobante de ejemplo */
.prev{position:sticky;top:0}
.foto{background:#434a55;padding:22px 20px;border-radius:var(--r)}
.foto .fx{transform:rotate(-1.4deg);filter:sepia(.14) contrast(.96)}
.fx{position:relative;background:#fff;border:1px solid #c9d0da;color:#1c2430;font:11px/1.45 var(--body);box-shadow:0 1px 2px rgba(15,43,87,.08),0 10px 28px rgba(15,43,87,.1);overflow:hidden}
.fx-wm{position:absolute;inset:0;display:grid;place-items:center;font:700 58px var(--display);letter-spacing:.14em;color:rgba(22,57,111,.07);transform:rotate(-24deg);pointer-events:none;user-select:none}
.fx-head{display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);border-bottom:1px solid #1c2430}
.fx-head>div{padding:11px 12px}
.fx-head b.rs{display:block;font:700 13px/1.25 var(--display);margin-bottom:3px}
.fx-letra{border-left:1px solid #1c2430;border-right:1px solid #1c2430;text-align:center;padding:8px 0 !important}
.fx-letra b{display:block;font:700 30px/1 var(--display)}
.fx-letra span{font-size:9px}
.fx-tipo{font:700 15px/1.2 var(--display);margin-bottom:3px}
.fx-rec{padding:9px 12px;border-bottom:1px solid #c9d0da;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.fx table{width:100%;border-collapse:collapse}
.fx th{background:#eef1f5;text-align:left;font-weight:600;padding:5px 12px;font-size:10px}
.fx td{padding:6px 12px;border-bottom:1px solid #eef1f5;vertical-align:top}
.fx .r{text-align:right;font-family:var(--mono);font-size:10.5px;white-space:nowrap}
.fx-tot{padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:3px 18px;justify-content:end;border-top:1px solid #c9d0da;margin-top:26px}
.fx-tot span{text-align:right}
.fx-tot b{font-family:var(--mono);text-align:right;font-weight:500}
.fx-tot .t{font-weight:700;font-size:12.5px}
.fx-cae{padding:9px 12px;border-top:1px solid #1c2430;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:10.5px}
.hl{background:linear-gradient(transparent 62%,rgba(44,125,148,.28) 62%)}
.smudge{filter:blur(1.6px);background:rgba(120,90,40,.12)}
.shot{background:#434a55;padding:12px;border-radius:var(--r)}
.shot img{display:block;max-width:100%;margin:0 auto;border-radius:3px}

/* ---------- exportación e impacto ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;flex-wrap:wrap}
.tab{padding:10px 12px;border:0;background:none;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--navy-deep);border-bottom-color:var(--amber)}
.sheet{max-height:440px;overflow:auto}
.sheet .tbl td,.sheet .tbl th{padding:6px 10px;white-space:nowrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.field input{font-family:var(--mono);font-size:14px}
.cmp{display:flex;flex-direction:column;gap:14px}
.cmp-row{display:grid;grid-template-columns:150px minmax(0,1fr) 84px;gap:12px;align-items:center}
.cmp-row .bar{height:22px;border-radius:4px}
.cmp-row .bar i{border-radius:4px;transition:width .3s}
.cmp-row.a .bar i{background:#9aa7ba}
.cmp-row b{font:600 15px var(--mono);text-align:right}
.big{font:700 40px/1.05 var(--display);color:var(--navy-deep);font-variant-numeric:tabular-nums}

/* ---------- carga de comprobante real ---------- */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(15,43,87,.45)}
.modal[hidden],.scrim[hidden],.drawer[hidden]{display:none}
.modal-card{width:min(540px,100%);background:var(--surface);border-radius:10px;box-shadow:0 20px 60px rgba(15,43,87,.3);display:flex;flex-direction:column}
.modal-card header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:12px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 16px;border:2px dashed #b9c4d3;border-radius:var(--r);text-align:center;cursor:pointer;color:var(--muted);background:#f8fafc}
.drop.over,.drop:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.drop strong{color:var(--navy-deep);font-size:15px}
.drop input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.work{display:flex;align-items:center;gap:12px;padding:18px 4px;color:var(--navy-deep);font-weight:500}
.err{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:9px 12px;font-size:13px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;background:var(--navy-deep);color:#fff;padding:10px 16px;border-radius:6px;font-weight:500;box-shadow:0 8px 24px rgba(15,43,87,.3);max-width:calc(100% - 32px)}
#toast[hidden]{display:none}

@media (max-width:1380px){.tbl .opt{display:none}}
@media (max-width:1020px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dw-body{grid-template-columns:minmax(0,1fr)}
  .prev{position:static}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;align-items:center;gap:12px;padding:10px 14px}
  .side-foot,.brand div{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav a{padding:8px 10px;white-space:nowrap}
  .nav a .lbl{display:none}
  .nav a[aria-current="page"] .lbl{display:inline}
  #view{padding:16px 16px 40px}
  .top{padding:10px 16px}

/* ================= lógica contable ================= */
const stageOf = d => ({ recibido: 0, leyendo: 1, validando: 2, imputando: 3 }[d.estado] ?? 4);

function excCard(x) {

const H_COMP = ['Fecha', 'Tipo', 'Cód. ARCA', 'Pto. Vta.', 'Número', 'CUIT emisor', 'Denominación', 'Neto gravado', 'No gravado / exento', 'IVA 21%', 'IVA 10,5%', 'IVA 27%', 'Perc. IVA', 'Perc. IIBB', 'Otros tributos', 'Total', 'Cuenta', 'Descripción de la cuenta'];

function filasComp() {
  return S.docs.filter(d => d.estado === 'registrado').sort((a, b) => fechaKey(a.fecha).localeCompare(fechaKey(b.fecha))).map(d => {

    return [d.fecha, tipoNombre(d), codArca(d), d.pv, d.nro, d.prov.cuit, d.prov.nombre, s * d.neto, s * d.nograv, s * d.iva21, s * d.iva105, s * d.iva27, s * d.percIva, s * d.percIibb, s * d.otros, s * d.total, d.cuenta, CUENTAS[d.cuenta]];

function leyendaMov(m) {
  if (m.doc) { const d = docDe(m.doc); return `Pago ${tipoCorto(d)} ${compNum(d)} ${d.prov.nombre}`; }
  if (m.venta) return `Cobranza ${m.venta.comp} ${m.venta.cliente}`;

function filasAsi() {

  S.bank.filter(m => ['sugerido', 'sin-identificar', 'consultado'].includes(m.estado)).forEach(m => rows.push(['Banco', m.fecha + '/2026', m.desc, m.importe, excTexto({ es: 'mov', kind: m.exc.kind, m })[0], EST_MOV[m.estado][0]]));

/* ---------- impacto ---------- */
const IMP = { docs: 400, movs: 600, minDoc: SUP.minDoc, minMov: SUP.minMov, autoDoc: 79, autoMov: 92, minExc: 2 };
function impCalc() {
  const manual = (IMP.docs * IMP.minDoc + IMP.movs * IMP.minMov) / 60;
  const auto = (IMP.docs * (1 - IMP.autoDoc / 100) + IMP.movs * (1 - IMP.autoMov / 100)) * IMP.minExc / 60;
  return { manual, auto, lib: Math.max(0, manual - auto), pct: manual > 0 ? Math.max(0, (1 - auto / manual) * 100) : 0 };
}
function impOut() {
  const r = impCalc(), mx = Math.max(r.manual, r.auto, 1), h = v => v.toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' h';
  return `<p class="eyebrow">Horas liberadas por mes</p><p class="big">${h(r.lib)}</p><p class="note" style="margin:4px 0 16px">Reducción de ${Math.round(r.pct)} % sobre la carga manual, con estos supuestos.</p>
    <div class="cmp"><div class="cmp-row a"><span>Carga manual</span><div class="bar"><i style="width:${r.manual / mx * 100}%"></i></div><b>${h(r.manual)}</b></div>

}

    const pg = await pdf.getPage(1), v0 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: Math.min(3, 1800 / v0.width) });

  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'procesar') procesar();
  else if (a === 'procesar-desde-detalle') { S.drawer = null; if (ruta() !== 'panel') location.hash = 'panel'; procesar(); }
  else if (a === 'reset') { if (upCtl) upCtl.abort(); seed(); S.nUp = 0; if (ruta() !== 'panel') location.hash = 'panel'; render(); $('#view').scrollTop = 0; toast('Demo reiniciada.'); }
  else if (a === 'open-doc') { S.drawer = { es: 'doc', id }; renderDrawer(); }
  else if (a === 'open-mov') { S.drawer = { es: 'mov', id }; renderDrawer(); }
  else if (a === 'close-drawer' || a === 'close-drawer-nav') { S.drawer = null; renderDrawer(); }
  else if (a === 'f-doc') { S.fDoc = el.dataset.f; render(); }
  else if (a === 'f-mov') { S.fMov = el.dataset.f; render(); }
  else if (a === 'tab') { S.tab = el.dataset.tab; render(); }
  else if (a === 'descargar') descargar();
  else if (a === 'copiar-tabla') copiar(tsv(S.tab), 'Tabla copiada. Pegala en Excel.');
  else if (a === 'copy-msg') copiar(msgCliente(movDe(id)), 'Mensaje copiado.');
  else if (a === 'upload-open') { $('#up').hidden = false; upRender('idle', ''); }
  else if (a === 'upload-close') { if (upCtl) upCtl.abort(); $('#up').hidden = true; }
  else if (a === 'upload-cancel') { if (upCtl) upCtl.abort(); }
  else if (ACC[a]) { ACC[a](id); render(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (!$('#up').hidden) { if (upCtl) upCtl.abort(); $('#up').hidden = true; } else if (S.drawer) { S.drawer = null; renderDrawer(); } }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches?.('tr.click')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('input', ev => {
  const k = ev.target.dataset?.imp; if (!k) return;
  let v = parseFloat(ev.target.value); if (!isFinite(v) || v < 0) v = 0; if (k.startsWith('auto')) v = Math.min(100, v);
  IMP[k] = v; $('#imp-out').innerHTML = impOut();
});
document.addEventListener('change', ev => { if (ev.target.id === 'up-file') leerComprobante(ev.target.files[0]); });
document.addEventListener('dragover', ev => { const d = ev.target.closest?.('#drop'); if (d) { ev.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', ev => { ev.target.closest?.('#drop')?.classList.remove('over'); });
document.addEventListener('drop', ev => { const d = ev.target.closest?.('#drop'); if (d) { ev.preventDefault(); d.classList.remove('over'); leerComprobante(ev.dataTransfer.files[0]); } });
window.addEventListener('hashchange', () => { S.drawer = null; render(); $('#view').scrollTop = 0; });

/* ================= inicio ================= */
$('#cli-n').textContent = CLIENTE.nombre;
$('#cli-d').textContent = `CUIT ${CLIENTE.cuit} · Período ${CLIENTE.periodo}`;
seed(); render();
(async () => {
  try {
    if (window.claude?.use) {
      const [s, d] = await Promise.all([claude.use('sample').catch(() => null), claude.use('downloads').catch(() => null)]);
      SAMPLE = s; DL = d;
      if (SAMPLE) LIMITS = await SAMPLE.limits().catch(() => null);
    }
  } catch (e) { /* la demo funciona igual sin estas capacidades */ }
  capsListas = true;
  if (!$('#up').hidden && !upCtl) upRender('idle', '');
})();
</script>
</body>
